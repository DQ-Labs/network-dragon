[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "network-dragon"
version = "0.1.0"
description = "Quiet, evidence-driven IPv4 network inventory"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "argon2-cffi>=23.1,<26", "httpx>=0.28,<1",
  "defusedxml>=0.7,<1", "psutil>=7,<8", "mcp>=1.20,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-defusedxml", "types-psutil"]

[project.scripts]
network-dragon = "network_dragon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/network_dragon"]

[tool.hatch.build.targets.wheel.force-include]
"backend/migrations" = "network_dragon/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
files = ["backend/network_dragon"]
check_untyped_defs = true

